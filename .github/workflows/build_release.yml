name: Multiplatform Build & Release

on:
  push:
    branches: [ "**" ]
  # Without a version it is a plain build; with one it cuts the release
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.6); leave empty to just build
        type: string
      prerelease:
        description: Pre-release (Play Store beta track)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ----------------------------------------------------------------
  # Release Preparation Job
  # ----------------------------------------------------------------
  # The changelog commit gets the tag, then the builds run on that tag.
  # A release created with GITHUB_TOKEN doesn't trigger workflows,
  # so it all happens in this run.
  prepare_release:
    name: Prepare Release
    if: inputs.version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ inputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog and tag it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): 📝 update the changelog for $VERSION"
          git tag "$VERSION"
          git push --atomic origin HEAD "refs/tags/$VERSION"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: gh release create "$VERSION" --verify-tag --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"

  # ----------------------------------------------------------------
  # Android Build Job
  # ----------------------------------------------------------------
  android_build:
    name: Android Build
    needs: prepare_release
    # Runs also when prepare_release is skipped (plain builds)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          IGDB_API_URL: ${{ secrets.IGDB_API_URL }}
          GAMERLOGUE_URL: ${{ secrets.GAMERLOGUE_URL }}
        run: |
          touch local.properties
          echo "APP_ENV=$APP_ENV" >> local.properties
          echo "IGDB_API_URL=$IGDB_API_URL" >> local.properties
          echo "GAMERLOGUE_URL=$GAMERLOGUE_URL" >> local.properties

      # Decode Keystore for Release builds
      - name: Decode Keystore
        if: inputs.version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build APK (Debug) for every push
      - name: Build APK (Debug)
        if: ${{ !inputs.version }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Debug APK
        if: ${{ !inputs.version }}
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # Build Signed Release Bundle/APK for Release
      - name: Build Release Bundle & APK
        if: inputs.version
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: release.keystore
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Upload Release Artifacts
        if: inputs.version
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab

      # Publish to Play Store
      - name: Publish to Play Store
        if: inputs.version
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.maicol07.gamerlogue # Update with actual package name if different
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: ${{ inputs.prerelease && 'beta' || 'production' }}
          status: completed

  # ----------------------------------------------------------------
  # Desktop Build Job (Matrix)
  # ----------------------------------------------------------------
  desktop_build:
    name: Desktop Build (${{ matrix.os }})
    needs: prepare_release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Windows specific setup (sometimes needed for WiX, but usually pre-installed)

      - name: Create local.properties
        shell: bash
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          IGDB_API_URL: ${{ secrets.IGDB_API_URL }}
          GAMERLOGUE_URL: ${{ secrets.GAMERLOGUE_URL }}
        run: |
          touch local.properties
          echo "APP_ENV=$APP_ENV" >> local.properties
          echo "IGDB_API_URL=$IGDB_API_URL" >> local.properties
          echo "GAMERLOGUE_URL=$GAMERLOGUE_URL" >> local.properties

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Desktop App (Linux Deb)
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:packageDeb

      - name: Build Desktop App (Windows Exe)
        if: runner.os == 'Windows'
        run: ./gradlew :desktopApp:packageExe

      - name: Build Desktop App (macOS Dmg)
        if: runner.os == 'macOS'
        run: ./gradlew :desktopApp:packageDmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
             desktopApp/build/compose/binaries/main/deb/*.deb
             desktopApp/build/compose/binaries/main/exe/*.exe
             desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Web Build Job
  # ----------------------------------------------------------------
  web_build:
    name: Web Build
    needs: prepare_release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          IGDB_API_URL: ${{ secrets.IGDB_API_URL }}
          GAMERLOGUE_URL: ${{ secrets.GAMERLOGUE_URL }}
        run: |
          touch local.properties
          echo "APP_ENV=$APP_ENV" >> local.properties
          echo "IGDB_API_URL=$IGDB_API_URL" >> local.properties
          echo "GAMERLOGUE_URL=$GAMERLOGUE_URL" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web Distribution
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: webApp/build/dist/composeWebCompatibility/productionExecutable/

      - name: Deploy to GitHub Pages
        if: inputs.version
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webApp/build/dist/composeWebCompatibility/productionExecutable

  # ----------------------------------------------------------------
  # Release Assets Job
  # ----------------------------------------------------------------
  release_assets:
    name: Upload Release Assets
    permissions:
      contents: write
    needs: [prepare_release, android_build, desktop_build, web_build]
    if: >-
      always() &&
      needs.prepare_release.result == 'success' &&
      (needs.android_build.result == 'success' || needs.desktop_build.result == 'success' || needs.web_build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      # Upload only: the release metadata stays as prepare_release set it
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: find artifacts -type f -exec gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber {} +

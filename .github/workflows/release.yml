name: Release

# The changelog commit gets the tag, then the builds run on that tag.
# A release created with GITHUB_TOKEN doesn't trigger workflows,
# so it all happens in this run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.0); empty to compute it from the commits
        type: string
      prerelease:
        description: Pre-release
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  # ----------------------------------------------------------------
  # Release Preparation Job
  # ----------------------------------------------------------------
  prepare_release:
    name: Prepare Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Repository for the links in the changelog
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # The bump needs the latest tag to be a full x.y.z version
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(git cliff --bumped-version)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit changelog and tag it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "$VERSION" -o CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): 📝 update the changelog for $VERSION"
          git tag "$VERSION"
          git push --atomic origin HEAD "refs/tags/$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git cliff --current --strip header -o RELEASE_NOTES.md
          gh release create "$VERSION" --verify-tag --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"

  build:
    name: Build
    needs: prepare_release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare_release.outputs.version }}
      release: true
    secrets: inherit

  # ----------------------------------------------------------------
  # Release Assets Job
  # ----------------------------------------------------------------
  # Also uploads what was built when another platform failed
  release_assets:
    name: Upload Release Assets
    needs: [prepare_release, build]
    if: ${{ !cancelled() && needs.prepare_release.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: android-release
          path: artifacts

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts

      # Multi-file artifacts are zipped below, so they're downloaded outside the flat upload dir
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          pattern: web-app
          path: bundles

      - name: Package web app
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          mkdir -p artifacts
          if [ -d bundles/web-app ]; then
            (cd bundles/web-app && zip -qr "$GITHUB_WORKSPACE/artifacts/web-app-$VERSION.zip" .)
          fi

      - name: Download Android debug symbols
        uses: actions/download-artifact@v8
        with:
          pattern: android-debug-symbols
          path: bundles

      # One zip per flavor: R8 mapping and native symbols share file names across flavors
      - name: Package Android debug symbols
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          shopt -s nullglob
          cd bundles/android-debug-symbols 2>/dev/null || exit 0
          for dir in mapping/*Release; do
            flavor=$(basename "$dir" Release)
            find . -path "*/${flavor}Release/*" -type f | zip -q "$GITHUB_WORKSPACE/artifacts/debug-symbols-$flavor-$VERSION.zip" -@
          done

      - name: Display downloaded files
        run: ls -R artifacts

      # Upload only: the release metadata stays as prepare_release set it
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: find artifacts -type f -exec gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber {} +

  # ----------------------------------------------------------------
  # GitHub Pages Job
  # ----------------------------------------------------------------
  deploy_web:
    name: Deploy to GitHub Pages
    needs: [prepare_release, build]
    if: ${{ !cancelled() && needs.prepare_release.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-app
          path: web-app

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ----------------------------------------------------------------
  # Play Store Job
  # ----------------------------------------------------------------
  # TODO: enable (drop `if: false`) once the app is ready for the Play Store
  publish_play_store:
    name: Publish to Play Store
    needs: build
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: android-release

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.maicol07.gamerlogue # Update with actual package name if different
          releaseFiles: android-release/bundle/release/*.aab
          track: ${{ inputs.prerelease && 'beta' || 'production' }}
          status: completed

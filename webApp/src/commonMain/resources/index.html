<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#FAFAEF" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#12140E" media="(prefers-color-scheme: dark)">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>Gamerlogue</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #FAFAEF;
            }

            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background-color: #12140E;
                }
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <!-- Placeholder shown until the bundle boots: ComposeViewport clears the body when it takes over. -->
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#68A500" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    <noscript>Gamerlogue requires JavaScript to run.</noscript>
    <!--suppress HtmlUnknownTarget -->
    <script src="webApp.js"></script>
    </body>
</html>
